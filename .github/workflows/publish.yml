# Publishes to PyPI when a version tag (v1.2.3) is pushed.
#
# Uses PyPI "trusted publishing" (OIDC), so no API token is stored in the
# repo. One-time setup on pypi.org: Your projects -> Publishing -> add a
# pending publisher with owner `myAI-2025`, repository `weather-mcp`,
# workflow `publish.yml`, environment `pypi`.
#
# Release: bump `version` in pyproject.toml and weather_mcp/__init__.py,
# commit, then:  git tag v0.1.0 && git push origin v0.1.0

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
