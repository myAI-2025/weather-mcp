[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-mcp"
version = "0.1.0"
description = "Minimal dependency-free Model Context Protocol server exposing get_weather and get_hourly_forecast tools, backed by the free Open-Meteo API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "myAI-2025" }]
keywords = ["mcp", "model-context-protocol", "weather", "open-meteo", "claude", "json-rpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "flake8"]

[project.urls]
Homepage = "https://github.com/myAI-2025/weather-mcp"
Repository = "https://github.com/myAI-2025/weather-mcp"
Issues = "https://github.com/myAI-2025/weather-mcp/issues"

[project.scripts]
weather-mcp = "weather_mcp.server:main"

[tool.setuptools]
packages = ["weather_mcp"]
